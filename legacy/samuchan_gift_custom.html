<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMUCHAN - Gift & Custom 3D</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        black: '#000000',
                        white: '#FFFFFF',
                        gray: {
                            50: '#F9FAFB',
                            100: '#F3F4F6',
                            200: '#E5E7EB',
                            300: '#D1D5DB',
                            800: '#1F2937',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            -webkit-font-smoothing: antialiased;
        }
        /* Hide scrollbar for cleaner look in some areas */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const MOCK_PRODUCTS = [
            { id: 1, name: "Tượng Chibi Custom theo ảnh", price: 350000, category: "Custom", image: "https://placehold.co/600x600/f3f4f6/1f2937?text=Chibi+Custom", badge: "Bán chạy", colors: ["Trắng", "Đen", "Sơn tay"], sizes: ["Nhỏ (5cm)", "Vừa (10cm)", "Lớn (15cm)"], basePrice: 350000, stockQuantity: 100 },
            { id: 2, name: "Đèn ngủ 3D Mặt Trăng", price: 250000, category: "Quà tặng", image: "https://placehold.co/600x600/f3f4f6/1f2937?text=Moon+Lamp", badge: "Mới", colors: ["Trắng ấm", "Trắng sáng"], sizes: ["Đường kính 10cm", "Đường kính 15cm"], basePrice: 250000, stockQuantity: 50 },
            { id: 3, name: "Móc khóa Logo Doanh Nghiệp in nổi", price: 45000, category: "Custom", image: "https://placehold.co/600x600/f3f4f6/1f2937?text=Keychain", colors: ["Đen/Trắng", "Trắng/Đỏ"], sizes: ["Tiêu chuẩn"], basePrice: 45000, stockQuantity: 200 },
            { id: 4, name: "Giá đỡ điện thoại Minimal", price: 85000, category: "Trang trí", image: "https://placehold.co/600x600/f3f4f6/1f2937?text=Phone+Stand", colors: ["Đen nhám", "Trắng mờ", "Xám"], sizes: ["Tiêu chuẩn"], basePrice: 85000, stockQuantity: 0 },
            { id: 5, name: "Lọ hoa đa giác 3D", price: 150000, category: "Trang trí", image: "https://placehold.co/600x600/f3f4f6/1f2937?text=Vase", colors: ["Trắng", "Đen"], sizes: ["Cao 15cm", "Cao 20cm"], basePrice: 150000, stockQuantity: 20 },
            { id: 6, name: "Bảng tên để bàn Custom", price: 200000, category: "Custom", image: "https://placehold.co/600x600/f3f4f6/1f2937?text=Name+Tag", colors: ["Đen/Trắng", "Xám/Đen"], sizes: ["Vừa", "Lớn"], basePrice: 200000, stockQuantity: 100 },
        ];

        const formatPrice = (price) => {
            return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "đ";
        };

        const Header = ({ setView, cartCount, isVisualEditor }) => (
            <header className={`${isVisualEditor ? 'relative' : 'sticky top-0'} z-50 bg-white/90 backdrop-blur-md border-b border-gray-100`}>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between items-center h-16">
                        {/* Logo */}
                        <div className="flex-shrink-0 flex items-center cursor-pointer" onClick={() => !isVisualEditor && setView('home')}>
                            <span className="font-bold text-2xl tracking-tighter">SAMU<span className="text-gray-400">CHAN</span></span>
                        </div>

                        {/* Desktop Nav */}
                        <nav className="hidden md:flex space-x-8">
                            <button onClick={() => !isVisualEditor && setView('home')} className="text-gray-900 hover:text-gray-600 text-sm font-medium transition-colors">Trang chủ</button>
                            <button onClick={() => !isVisualEditor && setView('shop')} className="text-gray-900 hover:text-gray-600 text-sm font-medium transition-colors">Sản phẩm</button>
                            <button onClick={() => !isVisualEditor && setView('tracking_login')} className="text-gray-900 hover:text-gray-600 text-sm font-medium transition-colors">Theo dõi đơn</button>
                            {!isVisualEditor && (
                                <button onClick={() => setView('admin')} className="text-gray-400 hover:text-gray-900 text-sm font-medium transition-colors border border-gray-200 px-2 py-1 rounded">Admin Demo</button>
                            )}
                        </nav>

                        {/* Cart & Mobile Menu */}
                        <div className="flex items-center space-x-4">
                            <button onClick={() => !isVisualEditor && setView('cart')} className={`relative text-gray-900 hover:text-gray-600 transition-colors p-2 ${isVisualEditor ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                <i className="ph ph-shopping-bag text-2xl"></i>
                                {cartCount > 0 && (
                                    <span className="absolute top-0 right-0 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-black rounded-full">
                                        {cartCount}
                                    </span>
                                )}
                            </button>
                            <button className="md:hidden text-gray-900 p-2">
                                <i className="ph ph-list text-2xl"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </header>
        );

        const Footer = () => (
            <footer className="bg-white border-t border-gray-100 mt-20">
                <div className="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                        <div className="col-span-1 md:col-span-2">
                            <span className="font-bold text-2xl tracking-tighter block mb-4">SAMU<span className="text-gray-400">CHAN</span></span>
                            <p className="text-gray-500 text-sm mb-4 max-w-sm">
                                Chuyên thiết kế, sản xuất quà tặng và đồ trang trí bằng công nghệ in 3D hiện đại. Độc bản - Tinh tế - Nhanh chóng.
                            </p>
                            <div className="flex space-x-4">
                                <a href="#" className="text-gray-400 hover:text-black transition-colors"><i className="ph ph-facebook-logo text-2xl"></i></a>
                                <a href="#" className="text-gray-400 hover:text-black transition-colors"><i className="ph ph-instagram-logo text-2xl"></i></a>
                            </div>
                        </div>
                        <div>
                            <h3 className="text-sm font-semibold text-black tracking-wider uppercase mb-4">Sản phẩm</h3>
                            <ul className="space-y-2 text-sm text-gray-500">
                                <li><a href="#" className="hover:text-black transition-colors">Quà tặng Custom</a></li>
                                <li><a href="#" className="hover:text-black transition-colors">Đồ trang trí</a></li>
                                <li><a href="#" className="hover:text-black transition-colors">Văn phòng phẩm</a></li>
                            </ul>
                        </div>
                        <div>
                            <h3 className="text-sm font-semibold text-black tracking-wider uppercase mb-4">Liên hệ</h3>
                            <ul className="space-y-2 text-sm text-gray-500">
                                <li>Zalo: 0123 456 789</li>
                                <li>Email: hello@samuchan.com</li>
                                <li>Địa chỉ: Quận 1, TP.HCM</li>
                            </ul>
                        </div>
                    </div>
                    <div className="mt-12 border-t border-gray-100 pt-8 flex flex-col md:flex-row justify-between items-center text-sm text-gray-400">
                        <p>&copy; 2024 SAMUCHAN. All rights reserved.</p>
                        <p>Minimalist 3D Printing Studio</p>
                    </div>
                </div>
            </footer>
        );

        const Home = ({ setView, products, siteConfig, setSiteConfig, isVisualEditor }) => {
            const [isEditingHero, setIsEditingHero] = useState(false);
            const [localConfig, setLocalConfig] = useState(siteConfig);

            const handleSaveHero = (e) => {
                e.preventDefault();
                setSiteConfig(localConfig);
                setIsEditingHero(false);
            };

            return (
                <div className="fade-in">
                    {/* Hero Section */}
                    <div className={`relative bg-white overflow-hidden ${isVisualEditor ? 'border-2 border-dashed border-indigo-400 hover:bg-indigo-50/30 transition-all m-4 rounded-xl' : ''}`}>
                        
                        {isVisualEditor && !isEditingHero && (
                            <button onClick={() => {setLocalConfig(siteConfig); setIsEditingHero(true)}} className="absolute top-4 right-4 z-20 bg-indigo-600 text-white px-4 py-2 rounded-md text-sm shadow-lg flex items-center hover:bg-indigo-700 fade-in">
                                <i className="ph ph-pencil-simple mr-2"></i> Chỉnh sửa Banner
                            </button>
                        )}

                        {isEditingHero && (
                            <div className="absolute inset-0 bg-white/95 z-30 p-4 sm:p-8 flex flex-col justify-center items-center backdrop-blur-sm fade-in">
                                <form onSubmit={handleSaveHero} className="w-full max-w-2xl bg-white p-6 rounded-xl shadow-2xl border border-gray-100 relative">
                                    <button type="button" onClick={() => setIsEditingHero(false)} className="absolute top-4 right-4 text-gray-400 hover:text-black">
                                        <i className="ph ph-x text-2xl"></i>
                                    </button>
                                    <h3 className="text-xl font-bold mb-4 text-black">Chỉnh sửa Banner Trang chủ</h3>
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs text-gray-500 mb-1 font-medium uppercase tracking-wide">Tiêu đề dòng 1</label>
                                                <input type="text" value={localConfig.heroTitle1} onChange={e => setLocalConfig({...localConfig, heroTitle1: e.target.value})} className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" required />
                                            </div>
                                            <div>
                                                <label className="block text-xs text-gray-500 mb-1 font-medium uppercase tracking-wide">Tiêu đề dòng 2 (Nhạt)</label>
                                                <input type="text" value={localConfig.heroTitle2} onChange={e => setLocalConfig({...localConfig, heroTitle2: e.target.value})} className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" required />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-500 mb-1 font-medium uppercase tracking-wide">Đoạn mô tả ngắn</label>
                                            <textarea value={localConfig.heroDesc} onChange={e => setLocalConfig({...localConfig, heroDesc: e.target.value})} className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" rows="3" required></textarea>
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-500 mb-1 font-medium uppercase tracking-wide">Link Ảnh Banner (URL)</label>
                                            <input type="text" value={localConfig.heroImage} onChange={e => setLocalConfig({...localConfig, heroImage: e.target.value})} className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" required />
                                        </div>
                                    </div>
                                    <div className="mt-6 flex space-x-3">
                                        <button type="submit" className="bg-indigo-600 text-white px-6 py-2 rounded text-sm font-medium hover:bg-indigo-700 transition-colors shadow-sm">Xác nhận (Preview)</button>
                                        <button type="button" onClick={() => setIsEditingHero(false)} className="bg-gray-100 text-gray-700 px-6 py-2 rounded text-sm font-medium hover:bg-gray-200 transition-colors">Hủy</button>
                                    </div>
                                </form>
                            </div>
                        )}

                        <div className="max-w-7xl mx-auto">
                            <div className="relative z-10 pb-8 bg-transparent sm:pb-16 md:pb-20 lg:max-w-2xl lg:w-full lg:pb-28 xl:pb-32 pt-20">
                                <main className="mt-10 mx-auto max-w-7xl px-4 sm:mt-12 sm:px-6 md:mt-16 lg:mt-20 lg:px-8 xl:mt-28">
                                    <div className="sm:text-center lg:text-left">
                                        <h1 className="text-5xl tracking-tight font-extrabold text-black sm:text-6xl md:text-7xl">
                                            <span className="block xl:inline">{siteConfig.heroTitle1}</span>{' '}
                                            <span className="block text-gray-300 xl:inline">{siteConfig.heroTitle2}</span>
                                        </h1>
                                        <p className="mt-3 text-base text-gray-500 sm:mt-5 sm:text-lg sm:max-w-xl sm:mx-auto md:mt-5 md:text-xl lg:mx-0">
                                            {siteConfig.heroDesc}
                                        </p>
                                        <div className="mt-5 sm:mt-8 sm:flex sm:justify-center lg:justify-start">
                                            <div className="rounded-md">
                                                <button onClick={() => !isVisualEditor && setView('shop')} className={`w-full flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-md text-white bg-black hover:bg-gray-800 md:py-4 md:text-lg transition-all duration-200 ${isVisualEditor ? 'opacity-75 cursor-not-allowed' : ''}`}>
                                                    Khám phá sản phẩm
                                                </button>
                                            </div>
                                            <div className="mt-3 sm:mt-0 sm:ml-3">
                                                <button onClick={() => !isVisualEditor && setView('tracking_login')} className={`w-full flex items-center justify-center px-8 py-3 border border-gray-300 text-base font-medium rounded-md text-black bg-white hover:bg-gray-50 md:py-4 md:text-lg transition-all duration-200 ${isVisualEditor ? 'opacity-75 cursor-not-allowed' : ''}`}>
                                                    Theo dõi đơn hàng
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </main>
                            </div>
                        </div>
                        <div className="lg:absolute lg:inset-y-0 lg:right-0 lg:w-1/2 mt-10 lg:mt-0 px-4 lg:px-0">
                            <img className="h-56 w-full object-cover sm:h-72 md:h-96 lg:w-full lg:h-full rounded-2xl lg:rounded-none lg:rounded-l-3xl shadow-sm" src={siteConfig.heroImage} alt="3D Printing" />
                        </div>
                    </div>

                    {/* Process Section */}
                    <div className="bg-gray-50 py-16 mt-12 lg:mt-0">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center">
                                <h2 className="text-base text-gray-500 font-semibold tracking-wide uppercase">Quy trình</h2>
                                <p className="mt-2 text-3xl leading-8 font-extrabold tracking-tight text-black sm:text-4xl">Đơn giản từ lúc chọn đến khi nhận</p>
                            </div>
                            <div className="mt-10">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-8 text-center">
                                    {[
                                        { icon: "ph-mouse-left", title: "1. Chọn sản phẩm", desc: "Khám phá và tùy chỉnh màu sắc, kích thước" },
                                        { icon: "ph-check-circle", title: "2. Xác nhận", desc: "SAMUCHAN liên hệ xác nhận thiết kế & đơn hàng" },
                                        { icon: "ph-printer-3d", title: "3. Sản xuất", desc: "In 3D và kiểm tra chất lượng (QC) kỹ lưỡng" },
                                        { icon: "ph-package", title: "4. Giao hàng", desc: "Đóng gói an toàn và giao đến tận tay bạn" }
                                    ].map((step, idx) => (
                                        <div key={idx} className="flex flex-col items-center">
                                            <div className="flex items-center justify-center h-16 w-16 rounded-full bg-white border border-gray-200 text-black mb-4 shadow-sm">
                                                <i className={`ph ${step.icon} text-3xl`}></i>
                                            </div>
                                            <h3 className="text-lg font-medium text-black">{step.title}</h3>
                                            <p className="mt-2 text-sm text-gray-500">{step.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Featured Products */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                        <div className="flex justify-between items-end mb-8">
                            <h2 className="text-2xl font-bold text-black tracking-tight flex items-center">
                                Sản phẩm nổi bật
                                {isVisualEditor && <span className="ml-3 text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded font-normal">Chỉnh sửa SP ở tab Sản phẩm</span>}
                            </h2>
                            <button onClick={() => !isVisualEditor && setView('shop')} className={`text-sm font-medium text-gray-600 hover:text-black flex items-center ${isVisualEditor ? 'opacity-50 cursor-not-allowed' : ''}`}>Xem tất cả <i className="ph ph-arrow-right ml-1"></i></button>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-y-10 gap-x-6">
                            {products.slice(0, 4).map(product => (
                                <ProductCard key={product.id} product={product} setView={setView} isVisualEditor={isVisualEditor} />
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ProductCard = ({ product, setView, isVisualEditor, onEdit, onDelete }) => {
            // If in visual editor and has edit capabilities (Shop page), allow hover effects.
            // If in visual editor but no edit capabilities (Home page), look disabled.
            const wrapperClasses = `group cursor-pointer relative ${
                isVisualEditor 
                    ? (onEdit ? 'hover:ring-2 hover:ring-indigo-400 hover:shadow-lg rounded-lg transition-all p-1 -m-1' : 'opacity-60 grayscale-[30%] cursor-not-allowed') 
                    : ''
            }`;

            return (
                <div className={wrapperClasses} onClick={() => !isVisualEditor && setView({ name: 'product', id: product.id })}>
                    
                    {isVisualEditor && onEdit && (
                        <div className="absolute top-3 right-3 flex flex-col space-y-2 z-20 fade-in hidden group-hover:flex">
                            <button onClick={(e) => { e.stopPropagation(); onEdit(); }} className="bg-white p-2 rounded-full shadow-lg border border-gray-100 text-blue-600 hover:bg-blue-50 transition-colors" title="Sửa sản phẩm">
                                <i className="ph ph-pencil-simple text-lg leading-none"></i>
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="bg-white p-2 rounded-full shadow-lg border border-gray-100 text-red-600 hover:bg-red-50 transition-colors" title="Xóa sản phẩm">
                                <i className="ph ph-trash text-lg leading-none"></i>
                            </button>
                        </div>
                    )}

                    <div className="w-full aspect-w-1 aspect-h-1 bg-gray-100 rounded-lg overflow-hidden border border-gray-100 relative">
                        <img src={product.image} alt={product.name} className={`w-full h-full object-center object-cover transition-opacity ${product.stockQuantity === 0 ? 'opacity-50 group-hover:opacity-50' : 'group-hover:opacity-90'}`} />
                        {product.stockQuantity === 0 && (
                            <div className="absolute inset-0 flex items-center justify-center">
                                <span className="bg-black/70 text-white px-3 py-1 text-sm font-medium rounded-full backdrop-blur-sm shadow-sm">Hết hàng</span>
                            </div>
                        )}
                        {product.badge && product.stockQuantity > 0 && (
                            <span className="absolute top-2 left-2 px-2 py-1 bg-white text-xs font-bold text-black border border-gray-200 rounded shadow-sm z-10">
                                {product.badge}
                            </span>
                        )}
                    </div>
                    <div className="mt-4 flex justify-between">
                        <div>
                            <h3 className="text-sm text-gray-700 font-medium group-hover:text-black transition-colors pr-2 line-clamp-2">{product.name}</h3>
                            <p className="mt-1 text-xs text-gray-500">{product.colors.length} màu sắc &bull; {product.sizes.length} size</p>
                        </div>
                        <p className="text-sm font-bold text-black whitespace-nowrap">{formatPrice(product.price)}</p>
                    </div>
                </div>
            );
        };

        const Shop = ({ setView, products, setProducts, isVisualEditor }) => {
            const [filter, setFilter] = useState('All');
            const categories = ['All', 'Custom', 'Quà tặng', 'Trang trí'];
            
            const [editingProduct, setEditingProduct] = useState(null);

            const filteredProducts = filter === 'All' ? products : products.filter(p => p.category === filter);

            const handleSaveProduct = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const updatedProduct = {
                    id: editingProduct.id || Date.now(),
                    name: formData.get('name'),
                    price: parseInt(formData.get('basePrice')),
                    basePrice: parseInt(formData.get('basePrice')),
                    category: formData.get('category'),
                    image: formData.get('image'),
                    badge: formData.get('badge'),
                    colors: formData.get('colors').split(',').map(c => c.trim()),
                    sizes: formData.get('sizes').split(',').map(s => s.trim()),
                    stockQuantity: parseInt(formData.get('stockQuantity'))
                };

                if (editingProduct.id) {
                    setProducts(products.map(p => p.id === updatedProduct.id ? updatedProduct : p));
                } else {
                    // Add to beginning of array for immediate visibility
                    setProducts([updatedProduct, ...products]);
                }
                setEditingProduct(null);
            };

            const handleDeleteProduct = (id) => {
                setProducts(products.filter(p => p.id !== id));
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 fade-in relative">
                    <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 border-b border-gray-100 pb-6">
                        <h1 className="text-3xl font-bold text-black tracking-tight mb-4 md:mb-0">
                            Tất cả sản phẩm
                            {isVisualEditor && <span className="ml-3 text-sm font-normal text-indigo-600 bg-indigo-50 px-2 py-1 rounded">Chế độ Chỉnh sửa</span>}
                        </h1>
                        
                        <div className="flex space-x-2 overflow-x-auto no-scrollbar pb-2 md:pb-0">
                            {categories.map(cat => (
                                <button 
                                    key={cat}
                                    onClick={() => setFilter(cat)}
                                    className={`px-4 py-2 text-sm rounded-md border whitespace-nowrap transition-colors ${filter === cat ? 'bg-black text-white border-black' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-300'}`}
                                >

                        {adminTab === 'dashboard' && (
                            <div>
                                <h1 className="text-2xl font-bold text-black mb-6">Tổng quan</h1>

                                    {[
                                        { label: 'Đơn chờ xử lý', value: '5', color: 'text-orange-500' },
                                        { label: 'Đang in 3D', value: '12', color: 'text-blue-500' },

                                        { label: 'Lượt truy cập', value: '142', color: 'text-gray-500' },
                                    ].map((stat, i) => (
                                        <div key={i} className="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                                            <p className="text-sm text-gray-500 font-medium">{stat.label}</p>
                                            <p className={`text-3xl font-bold mt-2 ${stat.color}`}>{stat.value}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
                                    <h2 className="text-lg font-medium mb-4">Đơn hàng mới nhất</h2>
                                    <div className="overflow-x-auto">
                                        <table className="min-w-full divide-y divide-gray-200 text-sm">
                                            <thead className="bg-gray-50">
                                                <tr>
                                                    <th className="px-6 py-3 text-left font-medium text-gray-500 uppercase tracking-wider">Mã đơn</th>
                                                    <th className="px-6 py-3 text-left font-medium text-gray-500 uppercase tracking-wider">Khách hàng</th>
                                                    <th className="px-6 py-3 text-left font-medium text-gray-500 uppercase tracking-wider">Trạng thái</th>
                                                    <th className="px-6 py-3 text-right font-medium text-gray-500 uppercase tracking-wider">Tổng tiền</th>
                                                </tr>
                                            </thead>
                                            <tbody className="bg-white divide-y divide-gray-200">
                                                {mockOrders.map((order, i) => (

                                                        <td className="px-6 py-4 whitespace-nowrap text-gray-500">{order.customer}</td>

                                                                {order.status}

                                                        </td>

                                                ))}

                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {adminTab === 'production' && (
                            <div>
                                <h1 className="text-2xl font-bold text-black mb-6">Quản lý Sản xuất (QC)</h1>
                                <p className="text-gray-500 mb-6 text-sm">Quản lý tiến độ in 3D để tránh nhầm màu/size.</p>
                                
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

                                            Chờ in <span>2</span>

                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-blue-50 border border-blue-100 rounded-lg p-4">
                                        <h3 className="font-bold text-blue-800 uppercase text-xs tracking-wider mb-4 flex justify-between">
                                            Đang in máy 1 & 2 <span>1</span>
                                        </h3>
                                        <div className="space-y-3">
                                            <div className="bg-white p-3 rounded border border-blue-200 shadow-sm border-l-4 border-l-blue-500">
                                                <div className="flex justify-between text-xs text-gray-500 mb-1">
                                                    <span>SAMU-1025</span>
                                                    <span className="text-blue-500 font-medium">Đang in 45%</span>
                                                </div>
                                                <p className="font-medium text-sm">Tượng Chibi Custom</p>

                                            Chờ QC / Đóng gói <span>1</span>
                                        </h3>
                                         <div className="space-y-3">
                                            <div className="bg-white p-3 rounded border border-green-200 shadow-sm">
                                                <div className="flex justify-between text-xs text-gray-500 mb-1">
                                                    <span>SAMU-1023</span>
                                                    <span>Hôm qua</span>
                                                </div>

                        {adminTab === 'orders' && (

                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [cart, setCart] = useState([]);
            
            const [products, setProducts] = useState(MOCK_PRODUCTS);
            const [siteConfig, setSiteConfig] = useState({
                heroTitle1: "Gift & Custom",
                heroTitle2: "3D Studio",
                heroDesc: "Tạo ra những món quà độc bản và đồ trang trí tinh tế bằng công nghệ in 3D hiện đại. Đơn giản, nhanh chóng và mang đậm dấu ấn cá nhân.",
                heroImage: "https://placehold.co/1200x800/f3f4f6/1f2937?text=Minimalist+3D+Printing"
            });

            // Visual Editor States
            const [isVisualEditor, setIsVisualEditor] = useState(false);
            const [backupData, setBackupData] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            const startVisualEditor = () => {
                // Save original state before editing
                setBackupData({ products: JSON.parse(JSON.stringify(products)), siteConfig: JSON.parse(JSON.stringify(siteConfig)) });
                setIsVisualEditor(true);
                setView('home'); // Automatically jump to Home to start visual editing
            };

            const saveVisualEditor = () => {
                setBackupData(null); // Commit changes, discard backup
                setIsVisualEditor(false);
                setToastMessage("Đã lưu thành công giao diện mới!");
                setTimeout(() => setToastMessage(null), 3500);
            };

            const cancelVisualEditor = () => {
                if (backupData) {
                    setProducts(backupData.products);
                    setSiteConfig(backupData.siteConfig);
                }
                setBackupData(null);
                setIsVisualEditor(false);
            };

            const addToCart = (product) => {
                const existingIndex = cart.findIndex(item => item.id === product.id && item.color === product.color && item.size === product.size);
                if (existingIndex >= 0) {
                    const newCart = [...cart];
                    newCart[existingIndex].quantity += product.quantity;
                    setCart(newCart);
                } else {
                    setCart([...cart, product]);
                }
            };

            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [view]);

            const renderView = () => {
                if (view === 'home') return <Home setView={setView} products={products} siteConfig={siteConfig} setSiteConfig={setSiteConfig} isVisualEditor={isVisualEditor} />;
                if (view === 'shop') return <Shop setView={setView} products={products} setProducts={setProducts} isVisualEditor={isVisualEditor} />;
                if (typeof view === 'object' && view.name === 'product') return <ProductDetail productId={view.id} setView={setView} addToCart={addToCart} products={products} />;
                if (view === 'cart') return <Cart cart={cart} setCart={setCart} setView={setView} />;
                if (view === 'checkout') return <Checkout cart={cart} setCart={setCart} setView={setView} />;
                if (view === 'success') return <OrderSuccess setView={setView} />;
                if (view === 'tracking_login') return <TrackingLogin setView={setView} />;
                if (view === 'tracking_demo') return <OrderTracking />;
                if (view === 'admin') return <AdminPanel setView={setView} startVisualEditor={startVisualEditor} />;
                return <Home setView={setView} products={products} siteConfig={siteConfig} setSiteConfig={setSiteConfig} isVisualEditor={isVisualEditor} />;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Global Admin Bar */}
                    {isVisualEditor && (
                        <div className="bg-indigo-600 text-white px-4 py-3 flex flex-col sm:flex-row justify-between items-center sticky top-0 z-[100] shadow-md">
                            <div className="flex items-center space-x-3 mb-3 sm:mb-0">
                                <span className="relative flex h-3 w-3">
                                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                                  <span className="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
                                </span>
                                <span className="font-bold text-sm tracking-wide">Chế độ Visual Editor (Preview)</span>
                                <span className="hidden sm:inline-block text-xs font-normal text-indigo-200">Bạn có thể sửa trực tiếp trên giao diện</span>
                            </div>
                            <div className="flex space-x-3 w-full sm:w-auto">
                                <button onClick={cancelVisualEditor} className="flex-1 sm:flex-none px-4 py-2 bg-indigo-800 rounded-md text-sm font-medium hover:bg-indigo-900 transition-colors shadow-sm text-center">Hủy thay đổi</button>
                                <button onClick={saveVisualEditor} className="flex-1 sm:flex-none px-4 py-2 bg-white text-indigo-700 font-bold rounded-md text-sm hover:bg-gray-100 shadow-sm transition-colors text-center">Lưu cho toàn trang</button>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 bg-gray-900 text-white px-6 py-4 rounded-lg shadow-2xl z-[150] fade-in flex items-center border border-gray-700">
                            <i className="ph ph-check-circle text-green-400 text-2xl mr-3"></i>
                            <span className="font-medium text-sm tracking-wide">{toastMessage}</span>
                        </div>
                    )}

                    {view !== 'admin' && <Header setView={setView} cartCount={cartCount} isVisualEditor={isVisualEditor} />}
                    <main className="flex-grow">
                        {renderView()}
                    </main>
                    {view !== 'admin' && <Footer />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
